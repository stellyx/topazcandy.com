<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <title>Topaz Candy orbital gem</title>
  <style>
    .mark-gem{transform-box:view-box;transform-origin:48px 48px;animation:mark-tumble 38s linear infinite}
    .mark-ring{transform-box:view-box;transform-origin:48px 48px;animation:mark-orbit 52s linear infinite}
    .mark-star{transform-box:fill-box;transform-origin:center;animation:mark-star 23s ease-in-out infinite}
    .mark-star.small{animation-duration:29s;animation-delay:-9s}
    @keyframes mark-tumble{0%{transform:rotate(0deg) scale(1,.95)}25%{transform:rotate(90deg) scale(.84,1)}52%{transform:rotate(187deg) scale(1,.86)}78%{transform:rotate(279deg) scale(.9,1)}100%{transform:rotate(360deg) scale(1,.95)}}
    @keyframes mark-orbit{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
    @keyframes mark-star{0%{transform:translate(0,0) rotate(0deg)}28%{transform:translate(-2px,2px) rotate(-110deg)}61%{transform:translate(1px,-2px) rotate(-235deg)}100%{transform:translate(0,0) rotate(-360deg)}}
    @media(prefers-reduced-motion:reduce){.mark-gem,.mark-ring,.mark-star{animation:none!important}}
  </style>
  <path class="mark-ring" d="M18 60C5 55 10 42 27 31c17-11 41-15 52-8" stroke="#927083" stroke-width="1.7" stroke-linecap="round"/>
  <g class="mark-gem" stroke="#4b2851" stroke-width="1.5" stroke-linejoin="round">
    <path d="m47 14 23 15 2 28-24 22-24-17-4-29Z" fill="#f2b544"/>
    <path d="m47 14-9 26-18-7Z" fill="#ffe4a3"/>
    <path d="m47 14 23 15-16 12-16-1Z" fill="#f8d991"/>
    <path d="m20 33 18 7-14 22Z" fill="#e39c38"/>
    <path d="m38 40 16 1 18 16-24 22-24-17Z" fill="#f2b544"/>
    <path d="m54 41 16-12 2 28Z" fill="#c87836"/>
    <path d="m38 40 10 39 6-38M24 62l30-21" stroke="#4b2851"/>
  </g>
  <path class="mark-ring" d="M13 48c-4 11 4 18 22 17 20-1 41-11 49-23 3-4 4-9 2-12" stroke="#4b2851" stroke-width="2.6" stroke-linecap="round"/>
  <path class="mark-ring" d="M35 65c19-1 39-10 47-20" stroke="#fff2c7" stroke-width="1.2" stroke-linecap="round"/>
  <path class="mark-star" d="m81 8 2.6 7.2L91 18l-7.4 2.7L81 28l-2.7-7.3L71 18l7.3-2.8Z" fill="#4b2851"/>
  <path class="mark-star small" d="m14 68 1.7 4.7L21 75l-5.3 1.9L14 82l-1.9-5.1L7 75l5.1-2.3Z" fill="#b96d32"/>
  <circle cx="78" cy="74" r="2.4" fill="#4b2851"/>
</svg>
